[package]
name = "guest_js_intl_data_gen"
version = "0.1.0"
edition = "2024"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
license = "LicenseRef-FSL-1.1-Apache-2.0"
description = "Convex baked ICU4X data generator"
repository = "https://github.com/get-convex/guest_js_intl_data_gen"
publish = false

[dependencies]
anyhow = "1"
icu_calendar = { version = "=2.3.0", default-features = false }
icu_casemap = { version = "=2.3.0", default-features = false, features = ["datagen"] }
icu_collator = { version = "=2.3.1", default-features = false }
icu_datetime = { version = "=2.3.0", default-features = false }
icu_decimal = { version = "=2.3.0", default-features = false, features = ["unstable"] }
icu_experimental = { version = "=0.6.0", default-features = false }
icu_list = { version = "=2.3.0", default-features = false }
icu_locale = { version = "=2.3.1", default-features = false }
icu_locale_fallback = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }  # just to add the data to the lockfile
icu_normalizer = { version = "=2.3.0", default-features = false }
icu_plurals = { version = "=2.3.0", default-features = false, features = ["unstable"] }
icu_provider = { version = "=2.3.1", default-features = false, features = ["export"] }
icu_provider_export = { version = "=2.3.0", default-features = false, features = ["baked_exporter", "rayon"] }
icu_provider_source = { version = "=2.3.1", default-features = false, features = ["icu_experimental", "networking", "unstable", "use_wasm"] }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["auto", "unstable"] }
icu_time = { version = "=2.3.0", default-features = false }
serde_json = "=1.0.151"
