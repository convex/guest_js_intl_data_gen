name: Generate ICU4X data

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intl-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Test generator
        run: cargo test --locked
      - name: Test Python scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  generate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Generate default locale data
        run: cargo run --release --locked -- data
      - name: Compile generated consumer
        run: python3 scripts/check_generated.py data
      - name: Package reproducibly
        run: python3 scripts/package.py data dist --commit "$GITHUB_SHA"
      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-js-intl-data
          path: |
            dist/guest_js_intl_data.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: guest-js-intl-data
          path: dist
      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish new tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/guest_js_intl_data.tar.gz dist/SHA256SUMS \
            --repo "$GH_REPO" --verify-tag \
            --title "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
